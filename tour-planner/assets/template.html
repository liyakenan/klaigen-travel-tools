<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תכנון טיול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="trip.js"></script>
<script src="research.js"></script>
<script src="geo.js"></script>
<style>
  :root{
    --brand:#0F766E; --brand-ink:#0B3B37;
    --ink:#24212B; --muted:#6B6675; --line:#EFE8DC;
    --cream:#FFF8EC; --sun:#FFC83D; --sun-soft:#FFF1C7; --coral:#FF6B5B;
  }
  @page{ size:A4; margin:10mm; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; color:var(--ink); background:#fff;
    font-family:"Rubik", "Arial Hebrew", Arial, sans-serif; font-size:10.4pt; line-height:1.5;
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  a{ color:inherit; text-decoration:none; }
  .sheet{ width:190mm; margin:0 auto; }
  @media screen{ body{ background:#EDE7DC; padding:16px; } .sheet{ width:214mm; background:#fff; padding:12mm; border-radius:12px; } }
  h1,h2,h3,.fred{ font-family:"Fredoka","Rubik",sans-serif; }

  /* ---------- photo hero ---------- */
  .hero{ position:relative; height:84mm; border-radius:20px; overflow:hidden; background:var(--brand); margin-bottom:4mm; }
  .hero img.photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,.18) 45%, rgba(0,0,0,0) 70%); }
  .hero-text{ position:absolute; right:7mm; left:7mm; bottom:6mm; color:#fff; z-index:2; }
  .hero-text .hello{ color:#fff; opacity:.95; margin:0 0 1mm; }
  .hero-text .big-title{ color:#fff; margin:0; font-size:31pt; }
  .flag{ position:absolute; top:6mm; left:7mm; z-index:3; width:21mm; border:2.5mm solid #fff; border-radius:3mm; transform:rotate(-7deg); background:#fff; }
  .flag img{ display:block; width:100%; border-radius:1mm; }
  .sticker{ position:absolute; top:5mm; right:7mm; z-index:3; background:var(--sun); color:var(--ink); font-family:Fredoka, Rubik, sans-serif; font-weight:700; font-size:11pt; padding:1.5mm 4mm; border-radius:999px; transform:rotate(4deg); }
  .credit{ font-size:6.5pt; color:var(--muted); margin:-3mm 2mm 3mm 0; }
  /* ---------- boarding-pass cover ---------- */
  .hello{ font-family:Fredoka, Rubik, sans-serif; font-size:13pt; color:var(--brand); font-weight:600; margin:2mm 0 1mm; }
  .big-title{ font-family:Fredoka, Rubik, sans-serif; font-size:30pt; font-weight:700; line-height:1.1; margin:0 0 5mm; }
  .pass{ display:grid; grid-template-columns:1fr 44mm; border-radius:16px; overflow:hidden; background:var(--brand); color:#fff; position:relative; }
  .pass-main{ padding:6mm 7mm; position:relative; }
  .pass-main::after{ content:"✈"; position:absolute; left:6mm; top:3mm; font-size:44pt; opacity:.13; transform:scaleX(-1); }
  .pass-label{ font-size:8pt; opacity:.75; letter-spacing:.4px; }
  .pass-dest{ font-family:Fredoka, Rubik, sans-serif; font-size:26pt; font-weight:700; line-height:1.05; margin:1mm 0 4mm; }
  .pass-grid{ display:grid; grid-template-columns:1fr 1fr; gap:3mm 6mm; }
  .pass-val{ font-weight:700; font-size:11pt; }
  .pass-stub{ background:var(--sun); color:var(--ink); padding:6mm 5mm; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border-right:2.5px dashed rgba(0,0,0,.25); }
  .pass-stub .n{ font-family:Fredoka, Rubik, sans-serif; font-size:34pt; font-weight:700; line-height:1; }
  .pass-stub .t{ font-weight:700; }
  .pass-stub img{ max-width:30mm; max-height:12mm; object-fit:contain; margin-top:4mm; }

  .howto{ margin:6mm 0 0; border:2px solid var(--line); border-radius:16px; padding:4mm 5mm; background:var(--cream); }
  .howto h3{ margin:0 0 2mm; font-size:13pt; }
  .howto ol{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:2.5mm 5mm; }
  .howto li{ display:flex; gap:3mm; align-items:flex-start; font-size:9.8pt; }
  .howto .ic{ flex:none; width:9mm; height:9mm; border-radius:50%; background:#fff; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13pt; }
  .intro{ font-size:11pt; margin:5mm 0 0; }
  .hotel-line{ display:flex; align-items:center; justify-content:space-between; gap:4mm; margin-top:5mm; padding:3mm 4mm; border-radius:14px; background:#F3F7F7; }
  .hotel-line .k{ font-size:8.5pt; color:var(--muted); }
  .hotel-line .v{ font-weight:800; }

  /* ---------- at a glance ---------- */
  .page{ break-before:page; }
  .page-title{ font-family:Fredoka, Rubik, sans-serif; font-size:21pt; font-weight:700; margin:0 0 1mm; }
  .page-sub{ color:var(--muted); margin:0 0 4mm; }
  .map{ width:100%; border-radius:16px; overflow:hidden; border:3px solid #fff; outline:2px solid var(--line); background:#EEF1F3; }
  .map-glance{ height:80mm; }
  .map-day{ height:66mm; }
  .glance{ display:grid; grid-template-columns:1fr 1fr; gap:3.5mm; margin-top:5mm; }
  .gday{ border-radius:16px; padding:3.5mm 4mm; background:var(--soft); border:2px solid var(--day); break-inside:avoid; }
  .gday-top{ display:flex; align-items:center; gap:3mm; }
  .emoji-badge{ width:11mm; height:11mm; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:16pt; flex:none; border:2px solid var(--day); }
  .gday .d{ font-size:8.8pt; color:var(--day-ink); font-weight:700; }
  .gday .t{ font-family:Fredoka, Rubik, sans-serif; font-weight:700; font-size:12.5pt; line-height:1.15; }
  .gday ul{ list-style:none; margin:2mm 0 0; padding:0; font-size:9.4pt; }
  .gday li{ display:flex; gap:2mm; }
  .gday li b{ min-width:11mm; color:var(--day-ink); }

  /* ---------- day ---------- */
  .day-hero{ display:flex; align-items:center; gap:4mm; background:var(--day); color:#fff; border-radius:18px; padding:4.5mm 5mm; margin-bottom:3.5mm; }
  .day-hero .emoji-badge{ width:15mm; height:15mm; font-size:22pt; border:none; }
  .day-hero .d{ font-weight:700; opacity:.9; font-size:10pt; }
  .day-hero .t{ font-family:Fredoka, Rubik, sans-serif; font-size:20pt; font-weight:700; line-height:1.1; }
  .day-hero .v{ font-size:9.8pt; opacity:.95; margin-top:.5mm; }
  .day-top{ display:grid; grid-template-columns:1fr 42mm; gap:3.5mm; align-items:stretch; }
  .route-card{ border-radius:16px; background:var(--soft); border:2px dashed var(--day); padding:3mm; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5mm; }
  .route-card .t{ font-weight:800; font-size:9.6pt; line-height:1.25; }
  .route-card .s{ font-size:8pt; color:var(--muted); }
  .qr svg{ display:block; width:28mm; height:28mm; background:#fff; padding:1.5mm; border-radius:8px; }
  .pill-btn{ display:inline-block; background:var(--day); color:#fff; font-weight:700; font-size:8.6pt; padding:1mm 3.5mm; border-radius:999px; }

  .stop{ display:grid; grid-template-columns:17mm 1fr; gap:3mm; margin-top:3.5mm; break-inside:avoid; }
  .when{ display:flex; flex-direction:column; align-items:center; gap:1.5mm; }
  .time{ background:var(--day); color:#fff; font-weight:800; font-size:9.6pt; padding:1mm 0; width:16mm; text-align:center; border-radius:999px; }
  .numicon{ width:12mm; height:12mm; border-radius:50%; background:var(--soft); border:2px solid var(--day); display:flex; align-items:center; justify-content:center; font-size:17pt; position:relative; }
  .numicon i{ position:absolute; top:-1.6mm; left:-1.6mm; font-style:normal; width:5.4mm; height:5.4mm; border-radius:50%; background:var(--day); color:#fff; font-size:7.5pt; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .done{ font-size:7.5pt; color:var(--muted); display:flex; align-items:center; gap:1mm; }
  .box{ width:3.6mm; height:3.6mm; border:1.5px solid var(--muted); border-radius:1mm; display:inline-block; }
  .card{ border:2px solid var(--line); border-radius:16px; padding:3mm 4mm; background:#fff; }
  .name{ font-family:Fredoka, Rubik, sans-serif; font-size:13pt; font-weight:700; line-height:1.2; }
  .local{ font-family:Rubik, sans-serif; font-weight:400; color:var(--muted); font-size:8.8pt; margin-inline-start:5px; }
  .chips{ display:flex; flex-wrap:wrap; gap:1.5mm; margin:1.6mm 0 1.8mm; }
  .chip{ background:#F5F2EC; border-radius:999px; padding:.3mm 2.6mm; font-size:8.7pt; white-space:nowrap; }
  .chip b{ font-weight:700; }
  .chip.star{ background:#FFF4D6; }
  .chip.walk{ background:#E7F6EF; }
  .chip.book{ background:var(--coral); color:#fff; font-weight:700; }
  .desc{ margin:0; }
  .note{ margin-top:2mm; background:var(--sun-soft); border-radius:10px 10px 10px 2px; padding:1.8mm 3mm; font-size:9.3pt; position:relative; }
  .btns{ display:flex; flex-wrap:wrap; gap:1.6mm; margin-top:2mm; }
  .b{ border-radius:999px; padding:.8mm 3.2mm; font-size:8.8pt; font-weight:700; border:1.5px solid; }
  .b.g{ color:#1A56C6; border-color:#BFD2F6; background:#F2F6FE; }
  .b.w{ color:#087EA4; border-color:#BCE6F5; background:#F0FAFE; }
  .b.s{ color:var(--ink); border-color:var(--line); background:#fff; }
  .walkline{ margin:1.5mm 0 0 0; padding-inline-start:20mm; font-size:8.8pt; color:var(--muted); }

  /* ---------- catalog ---------- */
  .group{ margin-top:5mm; }
  .group-h{ display:inline-flex; align-items:center; gap:2mm; font-family:Fredoka, Rubik, sans-serif; font-weight:700; font-size:13pt; padding:1mm 4mm; border-radius:999px; background:var(--sun); margin-bottom:2.5mm; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:3mm; }
  .cards .card{ break-inside:avoid; }
  .cards .name{ font-size:11.5pt; }
  .cards .desc{ font-size:9.5pt; }

  /* ---------- final ---------- */
  .todo{ list-style:none; margin:0; padding:0; }
  .todo li{ display:grid; grid-template-columns:7mm 1fr auto; gap:2mm; align-items:start; padding:2.4mm 0; border-bottom:2px dotted var(--line); }
  .todo .box{ width:4.6mm; height:4.6mm; margin-top:1mm; }
  .todo .w{ font-weight:800; }
  .todo .y{ font-size:9.2pt; color:var(--muted); }
  .know{ display:grid; grid-template-columns:1fr 1fr; gap:2.5mm; margin-top:3mm; }
  .know div{ background:var(--cream); border-radius:12px; padding:2.5mm 3.5mm; font-size:9.4pt; break-inside:avoid; }
  .contact{ margin-top:6mm; border-radius:18px; background:var(--brand); color:#fff; padding:5mm 6mm; display:grid; grid-template-columns:1fr auto; gap:5mm; align-items:center; break-inside:avoid; }
  .contact .t{ font-family:Fredoka, Rubik, sans-serif; font-size:16pt; font-weight:700; }
  .contact .s{ opacity:.9; font-size:9.6pt; }
  .wa{ display:inline-block; background:#25D366; color:#fff; font-weight:800; padding:2mm 5mm; border-radius:999px; font-size:11pt; }
  .contact .lines{ text-align:center; font-size:9.6pt; }
  .fine{ font-size:7.8pt; color:var(--muted); margin-top:3mm; }

  .mk{ width:26px; height:26px; border-radius:50%; color:#fff; font:700 12px/22px Rubik, Arial, sans-serif; text-align:center; border:2.5px solid #fff; }
  .mk-hotel{ width:30px; height:30px; border-radius:50%; background:#24212B; color:#fff; font:14px/26px Arial, sans-serif; text-align:center; border:2.5px solid #fff; }
  .leaflet-control-attribution{ font-size:7px !important; }
</style>
</head>
<body>
<div class="sheet" id="app"></div>
<script>
(function(){
  const T = window.TRIP; const app = document.getElementById('app');
  if(!T){ app.innerHTML = '<p>trip.js not found</p>'; return; }
  // days, catalog and tips may come from research.js (written by the research helpers); coordinates and times from geo.js
  if(!T.days && window.TRIP_DAYS) T.days = window.TRIP_DAYS.filter(Boolean);
  if(!T.catalog && window.TRIP_CATALOG) T.catalog = window.TRIP_CATALOG;
  if(!T.goodToKnow && window.TRIP_GOOD) T.goodToKnow = window.TRIP_GOOD;
  const GEO = window.GEO || {};
  const applyGeo = p => { const g = GEO[p.q]; if(!g) return;
    if(typeof p.lat !== 'number'){ p.lat = g[0]; p.lng = g[1]; }
    if(!p.fromHotel){ p.fromHotel = {}; if(g[2]) p.fromHotel.walk = g[2]; if(g[3]) p.fromHotel.car = g[3]; }
    if(g[4] && !p.next) p.next = g[4]; };
  (T.days||[]).forEach(d => (d.stops||[]).forEach(applyGeo));
  (T.catalog||[]).forEach(g => (g.items||[]).forEach(applyGeo));
  if(!T.bookAhead){ T.bookAhead = []; const addBook = p => { if(p.book) T.bookAhead.push({what:p.name, why:p.bookWhy || p.tip || '', url:p.tickets || p.url}); };
    (T.days||[]).forEach(d => (d.stops||[]).forEach(addBook)); (T.catalog||[]).forEach(g => (g.items||[]).forEach(addBook)); }
  // playful palette: [main, soft background, dark text]
  const DAYS = [['#FF6B5B','#FFF0EE','#C23A2C'],['#3BA7E8','#EAF6FD','#1D6FA3'],['#2CC38F','#E8F9F2','#18805C'],['#9B7BFF','#F3EFFF','#6247C9'],['#FF9F1C','#FFF4E5','#B86A00'],['#F06CB4','#FDEEF6','#B23A7C'],['#14B8C4','#E6F8FA','#0B7E87']];
  const DAY_EMOJI = ['🌉','🏰','🦁','🌳','🎡','🛍️','🌅'];
  const A = T.agency || {}, C = T.client || {};
  if(A.color) document.documentElement.style.setProperty('--brand', A.color);
  if(C.title) document.title = C.title;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // numbers, times and price ranges keep their left-to-right order inside Hebrew text
  const rl = s => esc(s).replace(/([€$£₪]?\d[\d.,:]*(?:\s?[–-]\s?[€$£₪]?\d[\d.,:]*)*)/g, '<bdi dir="ltr">$1</bdi>');
  const enc = encodeURIComponent;
  const gPlace = p => p.mapsUrl || ('https://www.google.com/maps/search/?api=1&query=' + enc(p.q || p.name));
  const waze = p => (p.lat && p.lng) ? ('https://waze.com/ul?ll=' + p.lat + ',' + p.lng + '&navigate=yes') : null;
  const MODE = T.mode || 'walking';
  const dayVars = i => { const c = DAYS[i % DAYS.length]; return '--day:' + c[0] + ';--soft:' + c[1] + ';--day-ink:' + c[2]; };
  function dayRouteUrl(stops){
    const pts = stops.filter(s => !s.skipRoute); if(!pts.length) return null;
    const dest = pts[pts.length-1], way = pts.slice(0,-1).map(s => s.q || s.name);
    let u = 'https://www.google.com/maps/dir/?api=1&origin=' + enc(T.hotel.q || T.hotel.name) + '&destination=' + enc(dest.q || dest.name) + '&travelmode=' + MODE;
    if(way.length) u += '&waypoints=' + enc(way.join('|'));
    return u;
  }
  const qrSvg = t => { try{ const q = qrcode(0,'M'); q.addData(t); q.make(); return q.createSvgTag({cellSize:4, margin:0, scalable:true}); }catch(e){ return ''; } };
  function chips(p){
    const c = [];
    if(p.rating) c.push('<span class="chip star">⭐ <b>' + esc(p.rating) + '</b>' + (p.ratingSrc ? ' · ' + esc(p.ratingSrc) : '') + '</span>');
    if(p.fromHotel){ const h = p.fromHotel;
      if(h.walk) c.push('<span class="chip walk">🚶 <b>' + esc(h.walk) + '</b> מהמלון</span>');
      if(h.car) c.push('<span class="chip">🚕 <b>' + esc(h.car) + '</b>' + (h.walk ? '' : ' מהמלון') + '</span>');
      if(h.transit) c.push('<span class="chip">🚇 <b>' + esc(h.transit) + '</b></span>'); }
    if(p.duration) c.push('<span class="chip">⏱ ' + rl(p.duration) + '</span>');
    if(p.price) c.push('<span class="chip">💰 ' + rl(p.price) + '</span>');
    if(p.hours) c.push('<span class="chip">🕘 ' + rl(p.hours) + '</span>');
    if(p.book) c.push('<span class="chip book">🎟️ להזמין מראש</span>');
    return '<div class="chips">' + c.join('') + '</div>';
  }
  function btns(p){
    const b = ['<a class="b g" href="' + esc(gPlace(p)) + '">📍 ניווט ב-Google Maps</a>'];
    const w = waze(p); if(w) b.push('<a class="b w" href="' + esc(w) + '">Waze</a>');
    if(p.url) b.push('<a class="b s" href="' + esc(p.url) + '">🌐 אתר</a>');
    if(p.tickets) b.push('<a class="b s" href="' + esc(p.tickets) + '">🎟️ כרטיסים</a>');
    return '<div class="btns">' + b.join('') + '</div>';
  }
  const head = p => '<div class="name">' + esc(p.name) + (p.local ? '<span class="local">' + esc(p.local) + '</span>' : '') + '</div>';
  const nDays = (T.days||[]).length;

  let h = '';
  /* ---------- cover ---------- */
  const hello = esc(C.hello || 'שלום, הנה הטיול שלכם! 👋');
  if(C.photo || C.countryCode){
    h += '<div class="hero">' + (C.photo ? '<img class="photo" src="' + esc(C.photo) + '" alt="">' : '') +
      (C.countryCode ? '<div class="flag"><img src="https://flagcdn.com/w160/' + esc(String(C.countryCode).toLowerCase()) + '.png" alt=""></div>' : '') +
      (C.sticker ? '<div class="sticker">' + esc(String(C.sticker).replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, '').trim()) + '</div>' : '') +
      '<div class="hero-text"><div class="hello">' + hello + '</div><h1 class="big-title">' + esc(C.title) + '</h1></div></div>';
    if(C.photoCredit) h += '<div class="credit">' + esc(C.photoCredit) + '</div>';
  } else {
    h += '<div class="hello">' + hello + '</div><h1 class="big-title">' + esc(C.title) + '</h1>';
  }
  h += '<div class="pass"><div class="pass-main"><div class="pass-label">יעד</div><div class="pass-dest">' + esc(C.destination || C.subtitle) + '</div><div class="pass-grid">';
  if(C.dates) h += '<div><div class="pass-label">תאריכים</div><div class="pass-val">' + esc(C.dates) + '</div></div>';
  if(C.travelers) h += '<div><div class="pass-label">נוסעים</div><div class="pass-val">' + esc(C.travelers) + '</div></div>';
  h += '<div><div class="pass-label">מלון</div><div class="pass-val">' + esc(T.hotel.name) + '</div></div>';
  if(C.extras) h += '<div><div class="pass-label">שימו לב</div><div class="pass-val">' + esc(C.extras) + '</div></div>';
  h += '</div></div><div class="pass-stub"><div class="n">' + nDays + '</div><div class="t">ימים של כיף</div>' + (A.logo ? '<img src="' + esc(A.logo) + '" alt="">' : '<div style="margin-top:3mm;font-weight:700">' + esc(A.name) + '</div>') + '</div></div>';
  if(T.intro) h += '<p class="intro">' + esc(T.intro) + '</p>';
  h += '<div class="howto"><h3>איך משתמשים בתכנון? 🧭</h3><ol>' +
       '<li><span class="ic">📅</span><span><b>כל יום בעמוד משלו</b>, לפי הסדר. השעות הן הצעה בלבד, לא חובה.</span></li>' +
       '<li><span class="ic">📍</span><span><b>לחצו על "ניווט"</b> ליד כל מקום, והטלפון יוביל אתכם לשם.</span></li>' +
       '<li><span class="ic">📱</span><span><b>סרקו את הקוד</b> בראש כל יום: כל המסלול של היום ייפתח בגוגל מפות.</span></li>' +
       '<li><span class="ic">🎟️</span><span><b>מה שמסומן באדום</b> צריך להזמין מראש. הרשימה המלאה בעמוד האחרון.</span></li></ol></div>';
  h += '<div class="hotel-line"><div><div class="k">🏨 המלון שלכם</div><div class="v">' + esc(T.hotel.name) + '</div><div class="k">' + esc(T.hotel.address) + '</div></div>' + btns(T.hotel) + '</div>';

  /* ---------- at a glance ---------- */
  h += '<section class="page"><h2 class="page-title">כל הטיול במבט אחד 👀</h2><p class="page-sub">כל צבע הוא יום. המספרים על המפה הם מספרי הימים.</p>';
  h += '<div class="map map-glance" id="map-glance" dir="ltr"></div><div class="glance">';
  (T.days||[]).forEach((d,i) => {
    h += '<div class="gday" style="' + dayVars(i) + '"><div class="gday-top"><span class="emoji-badge">' + esc(d.emoji || DAY_EMOJI[i % DAY_EMOJI.length]) + '</span><div><div class="d">יום ' + (i+1) + (d.date ? ' · ' + esc(d.date) : '') + '</div><div class="t">' + esc(d.title) + '</div></div></div><ul>' +
      (d.stops||[]).map(s => '<li><b>' + esc(s.time||'') + '</b><span>' + esc(s.emoji ? s.emoji + ' ' : '') + esc(s.name) + '</span></li>').join('') + '</ul></div>';
  });
  h += '</div>';
  if(T.myMapsUrl) h += '<div class="hotel-line" style="margin-top:4mm"><div class="qr">' + qrSvg(T.myMapsUrl) + '</div><div><div class="v">🗺️ כל הטיול על מפה בטלפון</div><div class="k">סרקו, ותקבלו את כל המקומות מסומנים לפי ימים, ישר בגוגל מפות.</div></div></div>';
  h += '</section>';

  /* ---------- days ---------- */
  (T.days||[]).forEach((d,i) => {
    const route = dayRouteUrl(d.stops||[]);
    h += '<section class="page" style="' + dayVars(i) + '">';
    h += '<div class="day-hero"><span class="emoji-badge">' + esc(d.emoji || DAY_EMOJI[i % DAY_EMOJI.length]) + '</span><div><div class="d">יום ' + (i+1) + (d.date ? ' · ' + esc(d.date) : '') + '</div><div class="t">' + esc(d.title) + '</div>' + (d.vibe ? '<div class="v">' + esc(d.vibe) + '</div>' : '') + '</div></div>';
    h += '<div class="day-top"><div class="map map-day" id="map-day-' + i + '" dir="ltr"></div>';
    h += route ? '<div class="route-card"><div class="t">כל המסלול של היום בגוגל מפות</div><div class="qr">' + qrSvg(route) + '</div><a class="pill-btn" href="' + esc(route) + '">לפתיחה ←</a><div class="s">סרקו או לחצו</div></div>' : '<div></div>';
    h += '</div>';
    (d.stops||[]).forEach((s,j) => {
      h += '<div class="stop"><div class="when"><div class="time">' + esc(s.time||'') + '</div><div class="numicon"><i>' + (j+1) + '</i>' + esc(s.emoji || '📍') + '</div><div class="done"><span class="box"></span> עשינו</div></div>';
      h += '<div class="card">' + head(s) + chips(s) + '<p class="desc">' + esc(s.desc) + '</p>' + (s.tip ? '<div class="note">💡 ' + esc(s.tip) + '</div>' : '') + btns(s) + '</div></div>';
      if(s.next && j < d.stops.length-1) h += '<div class="walkline">↓ ' + esc(s.next) + '</div>';
    });
    h += '</section>';
  });

  /* ---------- catalog ---------- */
  if((T.catalog||[]).length){
    h += '<section class="page"><h2 class="page-title">נשאר לכם זמן? 🎒</h2><p class="page-sub">' + esc(T.catalogIntro || 'עוד מקומות מגניבים, ליום גשום או סתם כשבא לכם משהו אחר. הזמנים מחושבים מהמלון שלכם.') + '</p>';
    T.catalog.forEach(g => {
      h += '<div class="group"><div class="group-h">' + esc(g.emoji ? g.emoji + ' ' : '') + esc(g.group) + '</div><div class="cards">';
      (g.items||[]).forEach(p => { h += '<div class="card">' + head(p) + chips(p) + '<p class="desc">' + esc(p.desc) + '</p>' + (p.tip ? '<div class="note">💡 ' + esc(p.tip) + '</div>' : '') + btns(p) + '</div>'; });
      h += '</div></div>';
    });
    h += '</section>';
  }

  /* ---------- checklist + tips + contact ---------- */
  h += '<section class="page">';
  if((T.bookAhead||[]).length){
    h += '<h2 class="page-title">לפני שטסים ✅</h2><p class="page-sub">את אלה כדאי לסגור מראש. סמנו וי על כל מה שסגרתם.</p><ul class="todo">' +
      T.bookAhead.map(b => '<li><span class="box"></span><div><div class="w">' + esc(b.what) + '</div><div class="y">' + esc(b.why) + '</div></div>' + (b.url ? '<a class="b s" href="' + esc(b.url) + '">להזמנה</a>' : '<span></span>') + '</li>').join('') + '</ul>';
  }
  if((T.goodToKnow||[]).length){
    h += '<h2 class="page-title" style="margin-top:7mm">טוב לדעת 💡</h2><div class="know">' + T.goodToKnow.map(x => '<div>' + esc(x) + '</div>').join('') + '</div>';
  }
  const wa = A.whatsapp ? 'https://wa.me/' + String(A.whatsapp).replace(/\D/g,'') : null;
  h += '<div class="contact"><div><div class="t">' + esc(A.contactTitle || 'צריכים משהו? אנחנו פה, גם באמצע הטיול 💬') + '</div><div class="s">' + esc(A.name) + (A.phone ? ' · ' + esc(A.phone) : '') + (A.email ? ' · ' + esc(A.email) : '') + '</div></div>' + (wa ? '<div class="lines"><a class="wa" href="' + wa + '">כתבו לנו בוואטסאפ</a></div>' : '') + '</div>';
  h += '<div class="fine">' + esc(T.disclaimer || 'שעות פתיחה, מחירים ודירוגים נבדקו בזמן הכנת התכנון ועשויים להשתנות. זמני הדרך משוערים. מומלץ לבדוק באתר הרשמי לפני היציאה.') + '</div></section>';

  app.innerHTML = h;

  /* ---------- maps ---------- */
  const TILE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const base = id => { const m = L.map(id, {zoomControl:false, fadeAnimation:false, zoomAnimation:false, markerZoomAnimation:false, scrollWheelZoom:false, dragging:false});
    L.tileLayer(TILE, {attribution:'© OpenStreetMap contributors', maxZoom:19}).addTo(m); return m; };
  const hotelIcon = () => L.divIcon({className:'', html:'<div class="mk-hotel">🏨</div>', iconSize:[30,30], iconAnchor:[15,15]});
  const numIcon = (n,col) => L.divIcon({className:'', html:'<div class="mk" style="background:' + col + '">' + n + '</div>', iconSize:[26,26], iconAnchor:[13,13]});
  const has = p => typeof p.lat === 'number' && typeof p.lng === 'number';
  const FITS = [];
  const g = base('map-glance'), gp = [];
  if(has(T.hotel)){ L.marker([T.hotel.lat,T.hotel.lng],{icon:hotelIcon(), zIndexOffset:1000}).addTo(g); gp.push([T.hotel.lat,T.hotel.lng]); }
  (T.days||[]).forEach((d,i) => (d.stops||[]).filter(has).forEach(s => { L.marker([s.lat,s.lng],{icon:numIcon(i+1, DAYS[i % DAYS.length][0])}).addTo(g); gp.push([s.lat,s.lng]); }));
  if(gp.length){ const f = () => { g.invalidateSize(false); g.fitBounds(gp,{padding:[28,28], maxZoom:15}); }; f(); FITS.push(f); }
  (T.days||[]).forEach((d,i) => {
    const col = DAYS[i % DAYS.length][0], m = base('map-day-' + i), pts = [];
    if(has(T.hotel)){ L.marker([T.hotel.lat,T.hotel.lng],{icon:hotelIcon(), zIndexOffset:1000}).addTo(m); pts.push([T.hotel.lat,T.hotel.lng]); }
    (d.stops||[]).forEach((s,j) => { if(has(s)){ L.marker([s.lat,s.lng],{icon:numIcon(j+1,col)}).addTo(m); pts.push([s.lat,s.lng]); } });
    if(pts.length > 1) L.polyline(pts,{color:col, weight:4, opacity:.8, dashArray:'2 9', lineCap:'round'}).addTo(m);
    if(pts.length){ const f = () => { m.invalidateSize(false); m.fitBounds(pts,{padding:[26,26], maxZoom:16}); }; f(); FITS.push(f); }
  });
  const refit = () => FITS.forEach(f => f());
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  window.addEventListener('load', refit); window.addEventListener('beforeprint', refit);
})();
</script>
</body>
</html>
